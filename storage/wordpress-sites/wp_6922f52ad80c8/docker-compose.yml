version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: wp_6922f52ad80c8_db
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Uj18hj3fTJKTOG9O
      MYSQL_DATABASE: wordpress_first
      MYSQL_USER: wpuser_first
      MYSQL_PASSWORD: wordpress_pass_first
    networks:
      - wp_6922f52ad80c8_network

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: wp_6922f52ad80c8
    ports:
      - "8080:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wpuser_first
      WORDPRESS_DB_PASSWORD: wordpress_pass_first
      WORDPRESS_DB_NAME: wordpress_first
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - wp_6922f52ad80c8_network

volumes:
  db_data:
  wordpress_data:

networks:
  wp_6922f52ad80c8_network:
    driver: bridge